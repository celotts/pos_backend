server:
  port: 8080 # Cambiado el puerto a 8080

spring:
  application:
    name: pos-api-rest
  datasource:
    url: jdbc:postgresql://db:5432/pos_db # Actualizado: nombre de BD 'pos_db'
    username: admin # Actualizado para coincidir con DB_USER del .env
    password: admin_password_123 # <--- CORREGIDO: Contraseña actualizada
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          # secret-key: ${JWT_SECRET:======================CelottsJWTSecretDefaultDevKey===========================} # Eliminado de aquí
          # La clave secreta ahora se define globalmente para el aplicación JWT
          # y se inyecta en JwtService.java
          # Si necesitas una clave específica para oauth2, deberías reevaluar su uso aquí.

management:
  endpoints:
    web:
      base-path: /actuator # <--- AÑADIDO: Define explícitamente el path base de Actuator
      exposure:
        include: "health,info"

logging:
  level:
    com.celotts: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:======================CelottsJWTSecretDefaultDevKey===========================} # Clave secreta para firmar JWTs (debe ser fuerte y Base64)
      expiration: 3600000 # Duración del token en milisegundos (1 hora = 3600000 ms)
